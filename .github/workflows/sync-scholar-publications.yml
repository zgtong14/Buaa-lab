name: Sync Google Scholar publications

on:
  schedule:
    - cron: "23 23 * * 0" # Monday 07:23 Asia/Shanghai; the cadence job selects alternate weeks.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-scholar-publications
  cancel-in-progress: false

jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Select alternate Mondays, or allow a manual run
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          from datetime import date, datetime, timedelta, timezone
          import os
          today = datetime.now(timezone(timedelta(hours=8))).date()
          weeks = (today - date(2026, 11, 2)).days // 7
          run = os.environ['EVENT_NAME'] == 'workflow_dispatch' or weeks % 2 == 0
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'run={str(run).lower()}\n')
          PY
  sync:
    needs: cadence
    if: needs.cadence.outputs.run == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bin/scholar-requirements.txt
      - name: Install Scholar dependencies
        run: python -m pip install -r bin/scholar-requirements.txt
      - name: Test bibliography merge
        run: python -m unittest discover -s test -p 'test_scholar_sync.py'
      - name: Fetch and append new publications
        run: timeout 600 python bin/sync_scholar_publications.py
      - name: Commit new publications
        id: commit
        run: |
          if ! git diff --quiet -- _bibliography/papers.bib; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- _bibliography/papers.bib
            git commit -m 'Update publications from Google Scholar'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      # A GITHUB_TOKEN push does not trigger the deploy workflow. Dispatch explicitly.
      - name: Deploy updated bibliography
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run deploy.yml --ref "$DEFAULT_BRANCH"
