# Homepage hero carousel slides, rendered by _includes/hero-carousel.liquid.
#
# Add / remove / reorder entries here — the markup and JS pick up whatever is
# in this list, so there is nothing else to edit. Fields:
#   image      - path under assets/img/ (no leading slash)
#   alt        - alt text, required; describe the photo, not the caption
#   caption_en - overlay text, English (optional; omit for an uncaptioned slide)
#   caption_zh - overlay text, Chinese  (optional)
#
# NOTE: these four are placeholders reusing the research stock photos, so the
# carousel is visible and laid out correctly from day one. Replace them with
# real lab photos — group shots, conference trips, award moments — by dropping
# files into assets/img/ and pointing the `image:` keys at them. Landscape
# images work best; each slide is cropped to 16:9.

